
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

Giải thích:

# localhost bên trong container Grafana trỏ đến chính container Grafana, không phải container Prometheus.

# Docker Compose tạo mạng nội bộ cho các service. Các container có thể giao tiếp với nhau bằng tên service thông qua DNS nội bộ.

# Vì service Prometheus có tên prometheus và sử dụng port 9090, Grafana cần kết nối qua địa chỉ http://prometheus:9090.